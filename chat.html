<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat · michiel · sdai.nl</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #6366f1 0%, #0b1020 55%);
        color: #e7e9f3;
      }
      .card {
        width: 100%; max-width: 640px; margin: 2rem; padding: 2.5rem;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px; backdrop-filter: blur(8px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      h1 { margin: 0 0 .25rem; font-size: 2rem; }
      .badge { display:inline-block; font-size:.8rem; padding:.2rem .6rem;
        background:#6366f1; border-radius:999px; margin-bottom:1rem; }
      .logo { display:block; width:96px; height:96px; margin:0 0 1.25rem; }
      a { color: #a5b4fc; }
      p { line-height: 1.6; opacity: .9; }

      .chat {
        display: flex; flex-direction: column; gap: .7rem;
        max-height: 440px; overflow-y: auto; padding: .25rem .25rem .25rem 0;
        margin: 1.25rem 0;
      }
      .bubble {
        max-width: 82%; padding: .7rem 1rem; border-radius: 16px;
        line-height: 1.5; font-size: .95rem; white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user {
        align-self: flex-end; background: #6366f1; color: #fff;
        border-bottom-right-radius: 4px;
      }
      .bubble.assistant {
        align-self: flex-start; background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.14); border-bottom-left-radius: 4px;
      }
      .bubble.system {
        align-self: center; background: rgba(255,255,255,0.05);
        color: #c7d2fe; font-size: .85rem; opacity: .9;
      }

      form { display: flex; gap: .6rem; }
      textarea {
        flex: 1; resize: none; min-height: 46px; padding: .7rem .8rem;
        font: inherit; color: #e7e9f3; background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
      }
      textarea:focus { outline: none; border-color: #6366f1; }
      button {
        padding: 0 1.2rem; font: inherit; font-weight: 600; cursor: pointer;
        color: #fff; background: #6366f1; border: 0; border-radius: 12px;
      }
      button:hover { background: #4f46e5; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .nav { margin-top: 1.25rem; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="karpos-logo.svg" alt="Logo Karpos Consulting" />
      <span class="badge">AI Chat · qwen3.8-27b</span>
      <h1>Chat met je assistant</h1>
      <p>Stel een vraag; het gesprek wordt via de server doorgestuurd.</p>

      <div class="chat" id="chat" aria-live="polite"></div>

      <form id="form">
        <textarea id="input" rows="1" placeholder="Typ je bericht…"></textarea>
        <button id="send" type="submit">Verstuur</button>
      </form>

      <p class="nav"><a href="/">← terug naar de homepagina</a></p>
    </main>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");

      // Entire conversation history (server receives this and forwards it).
      const messages = [];

      function addBubble(role, text) {
        const div = document.createElement("div");
        div.className = "bubble " + role;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        send.disabled = true;

        addBubble("user", text);
        messages.push({ role: "user", content: text });

        const loading = addBubble("assistant", "…");

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(messages),
          });

          const data = await res.json();
          if (!res.ok) {
            const err = data && data.error
              ? data.error + (data.detail ? " — " + data.detail : "")
              : "HTTP " + res.status;
            loading.classList.remove("assistant");
            loading.classList.add("system");
            loading.textContent = "Fout: " + err;
            return;
          }

          const content = data.choices && data.choices[0] &&
            data.choices[0].message && data.choices[0].message.content;
          const reply = (content || "").trim() || "(geen antwoord)";
          loading.textContent = reply;
          messages.push({ role: "assistant", content: reply });
        } catch (err) {
          loading.classList.remove("assistant");
          loading.classList.add("system");
          loading.textContent = "Netwerkfout: " + err.message;
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
